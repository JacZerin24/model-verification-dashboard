name: Archive and verify NBM QMD percentiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nbm-qmd.yml'
      - 'backend/nbm_qmd.py'
      - 'backend/test_qmd.py'
      - 'backend/nbm_tmax.py'
      - 'backend/tmax_observations.py'
      - 'backend/test_nbm_tmax.py'
      - 'backend/test_tmax_observations.py'
      - 'backend/probe_qmd_tmax.py'
  schedule:
    - cron: '47 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Recent UTC dates of 00/06/12/18Z cycles to sample (1–30)'
        required: false
        default: '2'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: verification-pipeline
  cancel-in-progress: false

jobs:
  qmd:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ecCodes GRIB2 support
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check 'eccodes>=2.38,<3' 2>&1 | tee /tmp/qmd-install.log
      - name: Run offline percentile and deterministic verification tests
        run: |
          set -o pipefail
          python -m unittest discover -s backend -p 'test_*.py' -v 2>&1 | tee /tmp/qmd-tests.log
      - name: Sample genuine NOAA NBM QMD GRIB2 distributions
        id: ingest
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.days || '2' }}
        run: |
          set -o pipefail
          python backend/nbm_qmd.py --days "$BACKFILL_DAYS" 2>&1 | tee /tmp/nbm-qmd-job.log
      - name: Verify genuine 18-hour NBM Tmax percentiles
        id: tmax
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          set -o pipefail
          python backend/nbm_tmax.py --days "$BACKFILL_DAYS" 2>&1 | tee /tmp/nbm-tmax-job.log
      - name: Inspect maximum-temperature percentile inventory
        run: python backend/probe_qmd_tmax.py

      - name: Store QMD source health and verified sample archive
        if: always()
        run: |
          mkdir -p diagnostics
          {
            echo 'NBM QMD point extraction status'
            echo "UTC: $(date -u +%FT%TZ)"
            echo 'Check last 80 log lines for source inventory or decoder errors:'
            if [ -f /tmp/qmd-install.log ]; then echo 'Install:'; tail -n 35 /tmp/qmd-install.log; fi
            if [ -f /tmp/qmd-tests.log ]; then echo 'Unit tests:'; tail -n 100 /tmp/qmd-tests.log; fi
            if [ -f /tmp/nbm-qmd-job.log ]; then echo 'Extractor:'; tail -n 100 /tmp/nbm-qmd-job.log; else echo 'No extractor log'; fi
            if [ -f /tmp/nbm-tmax-job.log ]; then echo '18-hour Tmax:'; tail -n 100 /tmp/nbm-tmax-job.log; else echo 'Tmax step did not complete'; fi
          } > diagnostics/qmd-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/qmd-run.txt
          if [ -f diagnostics/tmax-inventory.txt ]; then git add diagnostics/tmax-inventory.txt; fi
          if [ -f data/archive/qmd_forecasts.json ]; then git add data/archive/qmd_forecasts.json; fi
          if [ -f public/data/qmd.json ]; then git add public/data/qmd.json; fi
          for f in data/archive/tmax_forecasts.json data/archive/metar_max6h.json public/data/tmax.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: archive real NBM QMD station percentiles and verification'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Set up Node.js for GitHub Pages
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Build dashboard including the newest QMD dataset
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy updated QMD scores to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful percentile page deployment
        if: success()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p diagnostics
          {
            echo 'NBM QMD percentile dashboard deployed successfully'
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Site: $PAGE_URL"
          } > diagnostics/qmd-pages-success.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/qmd-pages-success.txt
          git commit -m 'ci: record successful QMD Pages deployment' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
