name: Update verification data and publish dashboard

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/**'
  schedule:
    - cron: '23 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: verification-pipeline
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test verification calculations (offline)
        run: python -m unittest discover -s backend -p 'test_*.py' -v

      - name: Fetch station guidance and observations
        run: python backend/pipeline.py

      - name: Retain rolling archive and published JSON on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/forecasts.json data/archive/observations.json public/data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "data: archive station forecasts and METAR verification"
            git push origin HEAD:main
          else
            echo "No new data changes."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        id: install
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/verify-npm.log

      - name: Typecheck and build frontend
        env:
          GITHUB_PAGES: 'true'
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/verify-build.log

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save sanitized build diagnostics if pipeline failed
        if: failure()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          mkdir -p diagnostics
          {
            echo "GitHub Pages deployment diagnostic"
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Install result: $INSTALL_OUTCOME"
            echo "Build result: $BUILD_OUTCOME"
            echo "Deploy result: $DEPLOY_OUTCOME"
            echo
            echo "NPM output:"
            if [ -f /tmp/verify-npm.log ]; then tail -n 80 /tmp/verify-npm.log; else echo "No npm log"; fi
            echo
            echo "Build output:"
            if [ -f /tmp/verify-build.log ]; then tail -n 100 /tmp/verify-build.log; else echo "No build log"; fi
          } > diagnostics/last-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/last-failure.txt
          git commit -m "ci: capture failed deployment diagnostics" || true
          git push origin HEAD:main || true

      - name: Record successful Pages deployment
        if: success()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p diagnostics
          {
            echo "GitHub Pages deployment verified successful"
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Site: $PAGE_URL"
            echo "Build result: ${{ steps.build.outcome }}"
            echo "Deploy result: ${{ steps.deployment.outcome }}"
          } > diagnostics/last-success.txt
          rm -f diagnostics/last-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diagnostics/
          git commit -m "ci: record successful Pages deployment" || true
          git push origin HEAD:main || true
