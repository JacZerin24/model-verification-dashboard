name: Browser smoke test (blank-screen prevention)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browser-smoke-only
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and browser smoke dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Build production Pages bundle
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Visit production-style Pages using Chromium
        id: smoke
        run: node scripts/browser-smoke.mjs
      - name: Upload screenshot and browser errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: diagnostics/browser-smoke*
          if-no-files-found: ignore
      - name: Publish browser smoke result to repository
        if: always()
        run: |
          mkdir -p diagnostics
          if [ ! -f diagnostics/browser-smoke.txt ]; then
            printf '%s\n' 'Browser smoke test could not start or build. Inspect workflow logs.' > diagnostics/browser-smoke.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/browser-smoke.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record Chromium blank-screen smoke results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
